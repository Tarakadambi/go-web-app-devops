apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app-prod
  namespace: argocd
spec:
  project: default

  spec:
  source:
    path: go-web-app-chart
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true