apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app-stage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Tarakadambi/go-web-app-devops.git
    targetRevision: main
    path: go-web-app-chart
  

  destination:
    server: https://kubernetes.default.svc
    namespace: stage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true