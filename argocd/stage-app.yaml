apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app-stage
  namespace: argocd
spec:
  project: default

  spec:
  source:
    path: go-web-app-chart
    helm:
      valueFiles:
        - values-stage.yaml
  destination:
    namespace: stage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true