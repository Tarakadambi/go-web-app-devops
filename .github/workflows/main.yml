name: CI
on:
  push:         
    branches: 
        - main 
    paths-ignore: 
        - 'README.md'
        -  'helm/**'
        
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.20

      - name: Build
        run: go build -o go-web-app 

      - name: Run tests
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:          
      - name: checkout repository
        uses: actions/checkout@v2

      - name: run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.49.0

      - name: Build Docker image
        run: docker build -t clusterstar/go-web-app:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
            uses: docker/build-push-action@v4
                
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

        - name: build and push action       
          uses: doc ker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: clusterstar/go-web-app:${{ github.run_id}}


update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update image tag in Helm chart
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.run_id }}\"/" helm/go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "Tarakadambi"
          git config --global user.email "tara.kadambi@github.com"
          git add helm/go-web-app-chart/values.yaml
          git commit -m "Update image tag in helmchart"
          git push 

