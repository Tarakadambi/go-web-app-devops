name: CI
on:
  push:
    branches: 
        - main    
    paths-ignore:
        - 'README.md'
        - 'helm/**'
        
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - name: Set up Go 1.21
          uses: actions/setup-go@v2
          with:
            go-version: 1.21

        - name: build
          run: go build -o go-web-app

        - name: test
          run: go test -v ./...
    code-quality:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v3
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v3
          with:
            version: v1.50.0

    push:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Log in to Docker Hub
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}
          - name: Build and push Docker image
            uses: docker/build-push-action@v2
            with:
              context: .
              file: ./Dockerfile        
              push: true
              tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}

    update-helm-chart:
          runs-on: ubuntu-latest
          needs: push
          steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update tag in Helm chart
            
              run: |
                sed -i "s/tag: .*/tag: \"${{ github.run_id }}\"/" helm/go-web-app/values.yaml
                git config --global user.email "tara.kadambi@gmail.com"
                git config --global user.name "TaraKadambi"
                git add helm/go-web-app/values.yaml
                git commit -m "Update tag in Helm chart"
                git push origin main


