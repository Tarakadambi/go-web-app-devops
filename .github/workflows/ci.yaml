name: CI

on: 
 push:
  branches:
   - main
  paths-ignore:
   - README.md
   - "helm/**"

jobs:
 build: 
 runs-on: ubuntu-latest

 steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Go
    uses: actions/setup-go@v5
    with:
      go-version: "1.21"

  - name: Build
    run: go build -o go-web-app

  - name: Test
    run: go test -v ./...

push:
runs-on: ubuntu-latest
needs: build

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Log in to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build and push Docker image
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./Dockerfile
      push: true
      tags: |
        ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}
        ${{ secrets.DOCKER_USERNAME }}/go-web-app:latest
        
update-helm-chart:
runs-on: ubuntu-latest
needs: push

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Update tag in Helm chart
    run: |
      sed -i 's/tag:.*/tag: "${{ github.run_id }}"/' helm/go-web-app/values.yaml

      git config --global user.email "tara.kadambi@gmail.com"
      git config --global user.name "TaraKadambi"

      git add helm/go-web-app/values.yaml

      git diff --staged --quiet || git commit -m "Update Helm image tag"

      git push origin main

